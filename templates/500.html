{% extends "base.html" %}

{% block title %}Server Error - BloodChain{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card">
            <div class="card-body py-5">
                <i class="fas fa-server fa-5x text-danger mb-4"></i>
                <h1 class="display-4 text-danger">500</h1>
                <h3>Internal Server Error</h3>
                <p class="lead">Something went wrong on our server. Please try again later.</p>
                <div class="mt-4">
                    <a href="{{ url_for('index') }}" class="btn btn-primary me-2">
                        <i class="fas fa-home me-1"></i>Go Home
                    </a>
                    <button onclick="location.reload()" class="btn btn-outline-secondary">
                        <i class="fas fa-redo me-1"></i>Reload Page
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
